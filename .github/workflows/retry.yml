name: oracle-a1-retry

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Installer OCI CLI
        run: pip install --quiet oci-cli

      - name: Sett opp innlogging
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
          OCI_USER: ${{ secrets.OCI_USER }}
          OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
        run: |
          mkdir -p ~/.oci
          printf '%s\n' "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=eu-frankfurt-1\nkey_file=~/.oci/key.pem\n' \
            "$OCI_USER" "$OCI_FINGERPRINT" "$OCI_TENANCY" > ~/.oci/config
          chmod 600 ~/.oci/config

      - name: Sjekk kapasitet og prøv å lage instansen
        env:
          C: ${{ secrets.OCI_TENANCY }}
          GH_TOKEN: ${{ github.token }}
          SUPPRESS_LABEL_WARNING: 'True'
          OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING: 'True'
        run: bash retry.sh
